[alltech-api]
enabled  = true
port     = http,https
filter   = alltech-api
logpath  = /var/log/nginx/access.log

# A POS on a flaky connection will produce the odd 401 as a token expires
# mid-shift, so the threshold sits above incidental failures.
maxretry = 20
findtime = 300
bantime  = 3600

# Banning locally would be pointless: the packets arrive from Cloudflare, not
# from the client. This blocks at the edge instead. Requires credentials in
# /etc/fail2ban/action.d/cloudflare.local -- see README.md.
banaction = cloudflare

[alltech-api-machine-token]
enabled  = true
port     = http,https
filter   = alltech-api
logpath  = /var/log/nginx/access.log

# Tighter jail for the one endpoint that takes a shared secret. Legitimate
# clients are the scheduler and the report job; neither ever guesses.
maxretry = 5
findtime = 600
bantime  = 86400
banaction = cloudflare
