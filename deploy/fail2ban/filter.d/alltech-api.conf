# Matches nginx combined log format.
#
# <HOST> must be the real client address, which means nginx has to be
# restoring it from CF-Connecting-IP. Without that this matches Cloudflare's
# addresses and banning them takes the site down. See README.md.
[Definition]

# Repeated rejected credentials against the machine-token exchange.
failregex = ^<HOST> .* "POST /api/celery-token/ HTTP/[0-9.]+" (401|403) .*$
            ^<HOST> .* "(GET|POST|PATCH|DELETE) /api/users/[^"]*" (401|403) .*$
            ^<HOST> .* "[A-Z]+ /api/[^"]*" 401 .*$

ignoreregex = ^<HOST> .* "GET /api/health/ HTTP/[0-9.]+" [0-9]+ .*$

datepattern = ^[^\[]*\[({DATE})
