# Production stack for the backend server.
#
# Differences from compose.yml, which is the development stack:
#   - the image is pulled from Docker Hub, never built here
#   - Postgres is not run locally; the database is Supabase
#   - log rotation is configured, because the default json-file driver grows
#     without limit and fills the disk on a long-lived server
#   - the app container ships its logs to Grafana Cloud Loki directly via
#     Docker's own logging driver, so nobody has to SSH in and grep a
#     container to see what happened. Chosen over running a collector
#     (Promtail/Alloy) as its own long-lived process: this is a small VPS,
#     and the driver adds no extra process at all -- the daemon ships logs
#     itself. redis stays on json-file; its own log line volume is noise,
#     not signal, and not worth shipping.
#
# TLS and the public reverse proxy are configured on the server and are
# deliberately not in this repo.

name: alltech

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASS} --save 60 1 --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    # Not published to the host: only the app needs it, and an exposed Redis
    # is one of the most reliably exploited things on the internet.
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASS}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  web:
    image: gachar4/alltech-backend:alltechv2
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    # Bound to loopback: the reverse proxy on this host is the only thing that
    # should reach it. Publishing on 0.0.0.0 would expose the origin directly
    # and let a client forge the X-Forwarded-Proto header the app trusts.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    # keep-file retains the usual local json-file logs alongside shipping to
    # Loki, so `docker logs` still works even if the network to Grafana
    # Cloud is down -- the driver only ships in addition to that, it does
    # not replace local logging.
    logging:
      driver: loki
      options:
        loki-url: "${LOKI_URL}"
        loki-external-labels: "job=alltech-backend,container={{.Name}}"
        keep-file: "true"
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:
