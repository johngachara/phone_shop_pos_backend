# Local development and test stack.
#
# This is the stack the endpoint sweep runs against. Write-path tests must never
# point at the live Supabase project or the live Redis -- see the testing
# protocol in the alltech-redesign-progress skill.
#
# Deployment does not use this file: production images are built in CI, pushed to
# Docker Hub, and pulled on the server, where nginx is configured once by hand and
# is deliberately not shipped from this repo.

name: alltech-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-postgres}
      POSTGRES_USER: ${DB_CRED:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
    ports:
      - "${HOST_DB_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_CRED:-postgres} -d ${DB_NAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASS:-devredis} --save 60 1
    ports:
      - "${HOST_REDIS_PORT:-56379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASS:-devredis}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10


  web:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      # Local stack only. These override whatever .env carries so that a developer
      # .env pointing at Supabase cannot accidentally aim the dev stack at it.
      SECURE_SSL_REDIRECT: "False"
      COLLECTSTATIC: "0" 
    # Source is mounted, so a code change is live on reload and does not need
    # the image rebuilt. Without this every edit reinstalled every dependency
    # to see a one-line change. The image still carries the code, so the
    # production image is unaffected -- this only shadows it locally.
    volumes:
      - .:/app
    command:
      - gunicorn
      - djangoProject15.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "2"
      - --timeout
      - "60"
      - --reload
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
    ports:
      - "${HOST_WEB_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
