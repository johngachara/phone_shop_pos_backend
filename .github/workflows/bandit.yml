# Bandit is a security linter designed to find common security issues in Python code.
# Runs the real bandit CLI directly and uploads SARIF via GitHub's own
# upload-sarif action, rather than a third-party wrapper action -- see the
# note below on why.

# https://pypi.org/project/bandit/ is Apache v2.0 licensed, by PyCQA

name: Bandit
on:
  push:
    # alltechv2 is the active branch (and the repo's default) -- "main" hasn't
    # had a commit land on it in the redesign, so this never actually ran on
    # real work, only via the weekly cron below.
    branches: [ "alltechv2" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "alltechv2" ]
  schedule:
    - cron: '28 13 * * 4'
  workflow_dispatch:

jobs:
  bandit:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bandit scan
        # Previously shundor/python-bandit-scan (pinned by SHA). Dropped: its
        # entrypoint script has a real bug -- both excluded_paths and ini_path
        # only ever get assigned INSIDE the `if [ "$INPUT_X" == "DEFAULT" ]`
        # branch, so passing either a real value silently has *no effect at
        # all* -- confirmed live twice (once per input) via the job log, each
        # time showing the exclusion completely absent from the constructed
        # bandit command. skips/level/confidence use if/else and do work, but
        # skips would suppress a check type everywhere, not just in tests.
        # Calling the real CLI directly sidesteps the wrapper's bugs entirely.
        run: |
          pip install bandit[sarif]
          bandit -r . --ini .bandit -f sarif -o results.sarif --exit-zero
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
