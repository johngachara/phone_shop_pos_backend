# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Bandit is a security linter designed to find common security issues in Python code.
# This action will run Bandit on your codebase.
# The results of the scan will be found under the Security tab of your repository.

# https://github.com/marketplace/actions/bandit-scan is ISC licensed, by abirismyname
# https://pypi.org/project/bandit/ is Apache v2.0 licensed, by PyCQA

name: Bandit
on:
  push:
    # alltechv2 is the active branch (and the repo's default) -- "main" hasn't
    # had a commit land on it in the redesign, so this never actually ran on
    # real work, only via the weekly cron below.
    branches: [ "alltechv2" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "alltechv2" ]
  schedule:
    - cron: '28 13 * * 4'
  workflow_dispatch:

jobs:
  bandit:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Bandit Scan
        uses: shundor/python-bandit-scan@9cc5aa4a006482b8a7f91134412df6772dbda22c
        with: # optional arguments
          # exit with 0, even with results found
          exit_zero: true # optional, default is DEFAULT
          # Github token of the repository (automatically created by Github)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed to get PR information.
          # File or directory to run bandit on
          # path: # optional, default is .
          # Report only issues of a given severity level or higher. Can be LOW, MEDIUM or HIGH. Default is UNDEFINED (everything)
          # level: # optional, default is UNDEFINED
          # Report only issues of a given confidence level or higher. Can be LOW, MEDIUM or HIGH. Default is UNDEFINED (everything)
          # confidence: # optional, default is UNDEFINED
          # comma-separated list of paths (glob patterns supported) to exclude from scan (note that these are in addition to the excluded paths provided in the config file) (default: .svn,CVS,.bzr,.hg,.git,__pycache__,.tox,.eggs,*.egg)
          # excluded_paths: # optional, default is DEFAULT -- see ini_path below; this input is broken in this action version (pinned by SHA):
          # its entrypoint script only ever assigns `-x $INPUT_EXCLUDED_PATHS`
          # inside the branch that checks INPUT_EXCLUDED_PATHS == "DEFAULT",
          # so a real value here is silently dropped and never reaches bandit.
          # comma-separated list of test IDs to skip
          # skips: # optional, default is DEFAULT
          # path to a .bandit file that supplies command line arguments
          # Bandit's job is policing production code; a test suite asserting on
          # fixture data (fake device tokens, throwaway JWT secrets, plain
          # `assert`) is not that boundary. `--ini` is wired through correctly
          # in this action (unlike excluded_paths above), so the exclusion
          # lives in .bandit at the repo root instead.
          ini_path: .bandit

